name: CI and staged web deployment

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      stage_web:
        description: 'Stage a production Vercel web deployment without assigning domains'
        type: boolean
        default: false
      stage_api:
        description: 'Stage a production Vercel API deployment without assigning domains'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:api
      - run: npm run build
      - run: npm run test:api:build

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  stage_web:
    if: github.event_name == 'workflow_dispatch' && inputs.stage_web && github.ref == 'refs/heads/main'
    needs: [checks, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_CLI_VERSION: ${{ vars.VERCEL_CLI_VERSION }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install the configured Vercel CLI
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERCEL_CLI_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Set VERCEL_CLI_VERSION to a reviewed exact version.'; exit 1; }
          test -n "$VERCEL_ORG_ID" && test -n "$VERCEL_PROJECT_ID"
          npm install --global "vercel@$VERCEL_CLI_VERSION"
      - name: Pull production configuration
        run: vercel pull --yes --environment=production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Build web deployment
        run: vercel build --prod
      - name: Stage without assigning domains
        run: vercel deploy --prebuilt --prod --skip-domain
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

  stage_api:
    if: github.event_name == 'workflow_dispatch' && inputs.stage_api && github.ref == 'refs/heads/main'
    needs: [checks, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_API_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_API_PROJECT_ID }}
      VERCEL_CLI_VERSION: ${{ vars.VERCEL_CLI_VERSION }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install the configured Vercel CLI
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERCEL_CLI_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Set VERCEL_CLI_VERSION to a reviewed exact version.'; exit 1; }
          test -n "$VERCEL_ORG_ID" && test -n "$VERCEL_PROJECT_ID"
          npm install --global "vercel@$VERCEL_CLI_VERSION"
      - name: Pull production API configuration
        run: vercel pull --yes --environment=production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Build API deployment
        run: vercel build --prod
      - name: Stage API without assigning domains
        run: vercel deploy --prebuilt --prod --skip-domain
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
